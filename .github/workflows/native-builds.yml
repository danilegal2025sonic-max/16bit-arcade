name: Android, desktop and iOS builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            command: desktop:windows
            artifact: windows-x64
            paths: release/*.exe
          - label: Linux x64
            runner: ubuntu-24.04
            command: desktop:linux
            artifact: linux-x64
            paths: |
              release/*.AppImage
              release/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: 16bit-arcade-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  macos:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple silicon
            runner: macos-15
            command: desktop:mac:arm64
            artifact: macos-arm64
          - label: macOS Intel
            runner: macos-26-intel
            command: desktop:mac:x64
            artifact: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: 16bit-arcade-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - name: Prepare persistent Android signing key when configured
        id: android-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ARCADE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ARCADE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ARCADE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ARCADE_ANDROID_KEYSTORE_PASSWORD" && -n "$ARCADE_ANDROID_KEY_ALIAS" && -n "$ARCADE_ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arcade-release.jks"
            echo "ARCADE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/arcade-release.jks" >> "$GITHUB_ENV"
            echo "ARCADE_ANDROID_RELEASE_SIGNING=enabled" >> "$GITHUB_ENV"
            echo "ARCADE_ANDROID_KEYSTORE_PASSWORD=$ARCADE_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ARCADE_ANDROID_KEY_ALIAS=$ARCADE_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ARCADE_ANDROID_KEY_PASSWORD=$ARCADE_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "ARCADE_ANDROID_RELEASE_SIGNING=disabled" >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK or portable debug APK
        run: |
          if [[ "$ARCADE_ANDROID_RELEASE_SIGNING" == "enabled" ]]; then
            npm run android:release-apk
            mkdir -p android-artifact
            cp android/app/build/outputs/apk/release/app-release.apk android-artifact/16bit-arcade-android.apk
          else
            npm run android:apk
            mkdir -p android-artifact
            cp android/app/build/outputs/apk/debug/app-debug.apk android-artifact/16bit-arcade-android.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: 16bit-arcade-android
          path: android-artifact/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -configuration Release
          -derivedDataPath build/ios-simulator
          CODE_SIGNING_ALLOWED=NO

  publish:
    name: Publish multiplatform release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, macos, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 16bit-arcade-*
          path: release-assets
          merge-multiple: true
      - name: Label Android APK
        run: mv release-assets/16bit-arcade-android.apk "release-assets/16bit-arcade-${GITHUB_REF_NAME}-android.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE=".github/release-notes-${GITHUB_REF_NAME}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            NOTES_FILE=".github/release-notes.md"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "16-Bit Arcade $GITHUB_REF_NAME — Grande Atualização" \
              --notes-file "$NOTES_FILE"
          fi
